//=====================================================
/*---kode validasi lengkap untuk input Nominal supaya:
//=====================================================
// Ambil semua input nominal (tambah & edit)
const nominalInputs = document.querySelectorAll("#jumlah, #editNominal");

// Fungsi: Format ribuan
function formatRibuan(angka) {
    return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// Fungsi: Bersihkan input → hanya angka
function bersihkanAngka(text) {
    return text.replace(/[^\d]/g, ""); // Hanya angka
}

// Fungsi utama untuk validasi & format
function handleNominalInput(e) {
    let input = e.target;
    let nilai = input.value;

    // 1. Tidak boleh minus
    if (nilai.includes("-")) {
        alert("Nominal tidak boleh minus!");
        input.value = "";
        return;
    }

    // 2. Tidak boleh desimal (, atau . sebagai koma)
    if (nilai.includes(",") || (nilai.includes(".") && nilai.split(".").length > 2)) {
        alert("Nominal tidak boleh desimal!");
        input.value = bersihkanAngka(nilai);
        return;
    }

    // 3. Bersihkan semua titik lalu jadikan angka murni
    let angkaBersih = bersihkanAngka(nilai);

    // 4. Format ribuan
    if (angkaBersih !== "") {
        input.value = formatRibuan(angkaBersih);
    }
}

// Pasang event listener ke semua input nominal
nominalInputs.forEach(inp => {
    inp.addEventListener("input", handleNominalInput);
});

//ambil nilai angka asli (tanpa titik) untuk simpan ke database:
const jumlah = Number(document.getElementById("jumlah").value.replace(/\./g, "")); //untuk jumlah
const newJumlah = Number(document.getElementById("editNominal").value.replace(/\./g, "")); //untuk edit

</script>

	async function loadNasabah() {

	  const uid = user.uid; //ambil id user

	  const docRef = doc(db, "users", uid, "nasabah", nasabahId); //buat referensi data path

//=================================================================================================|
//=====Simpan Transaksi - tambah transaksi 1.form tidak refresh 2.saldo update 3.tabel update======|
//==================================================================================================|  
  window.simpanTransaksi = async function () {
    const jenis = document.getElementById("jenis").value;
    //const jumlah = Number(document.getElementById("jumlah").value);
	const jumlah = Number(document.getElementById("jumlah").value.replace(/\./g, "")); //untuk jumlah
    const ket = document.getElementById("keterangan").value;
	closeModalBtn(tambah);//tutup modal
    const user = auth.currentUser;
	const uid = user.uid;  // tambahan UID pemilik data
    const ref = doc(db, "users", user.uid, "nasabah", nasabahId);
    const snap = await getDoc(ref); //baca data nasabah
    const data = snap.data();

    const saldoBaru = jenis === "masuk" ? data.saldo + jumlah : data.saldo - jumlah;
		//closePopupTambah();
  // 1. Simpan transaksi ke Firestore
    await addDoc(collection(db, "users", user.uid, "nasabah", nasabahId, "transaksi"), {
      jenis,
      jumlah,
      keterangan: ket,
      createdAt: new Date()	  
    });

  //alert("Transaksi berhasil diproses!");

    await updateDoc(ref, { saldo: saldoBaru });
    loadNasabah(nasabahId);		
  };

//======== delete transaksi =============|
//=======================================|
document.getElementById("btnDeleteSelected").addEventListener("click", async () => {
  const checks = document.querySelectorAll(".trxCheck:checked");
  if (checks.length === 0) return alert("Tidak ada transaksi dipilih!");

  if (!confirm(`Hapus ${checks.length} transaksi terpilih?`)) return;

  const uid = auth.currentUser.uid;
  const idNasabah = localStorage.getItem("selectedNasabah");
  const nasabahDoc = doc(db, "users", uid, "nasabah", idNasabah);

	
  let saldoChange = 0;

  try {
    for (let c of checks) {
      const trxId = c.getAttribute("data-id");
      const jenis = c.getAttribute("data-jenis");
      const nominal = Number(c.getAttribute("data-jumlah"));

      // Hitung perubahan saldo dari html
      if (jenis === "masuk") saldoChange -= nominal;
      else saldoChange += nominal;

      //await deleteDoc(doc(db, "users", uid, "nasabah", idNasabah, "transaksi", trxId));
	  // Reference doc transaksi perbaikan 
    const trxDoc = doc(db, "users", uid, "nasabah", nasabahId, "transaksi", trxId);
    await deleteDoc(trxDoc);
    }

    // update saldo setelah selesai
    if (saldoChange !== 0) {
      await updateDoc(nasabahDoc, { saldo: increment(saldoChange) });
	//  await updateDoc(nasabahDoc, { saldo: saldoChange });
    //await updateDoc(ref, { saldo: saldoChange });//tambahan

    }
    loadNasabah(nasabahId);	  //tambahan
    //alert("Transaksi berhasil dihapus!");
	
  } catch (error) {
    console.error(error);
    alert("Gagal menghapus transaksi");
  }
});

window.hapusNasabah = async function() {
  // 1. Konfirmasi dengan template literal
  if (!confirm(`Yakin ingin menghapus nasabah  beserta semua transaksi?`)) {
    return;
  }

  const uid = auth.currentUser.uid;
  //const id = localStorage.getItem("selectedNasabah");
  //const nasabahDoc = doc(db, "users", uid, "nasabah", idNasabah);
  // cek user login
  //const user = auth.currentUser;//2. Ambil user yang sedang login
  if (!uid) {
    alert("User tidak terautentikasi!");
    return;
  }
  //const uid = user.uid;
  // referensi dokumen nasabah
  const nasabahRef = doc(db, "users", uid, "nasabah", nasabahId); //3. Referensi dokumen nasabah

  // referensi koleksi transaksi
  const transRef = collection(db, "users", uid, "nasabah", nasabahId, "transaksi");

  // ambil semua transaksi
  const transSnap = await getDocs(transRef);

  // batch delete
  const batch = writeBatch(db);
  transSnap.forEach(tx => {
    batch.delete(tx.ref);//6. Hapus transaksi dalam batch
  });

  // jalankan batch hapus transaksi
  await batch.commit();

  // hapus dokumen nasabah
  await deleteDoc(nasabahRef);

  alert("Nasabah dan semua transaksinya berhasil dihapus!");
  window.location.href = "dashboard.html";
}

//Proses Update + Hitung Selisih Saldo
document.getElementById("btnSaveEdit").addEventListener("click", async () => {
  const uid = auth.currentUser.uid; 
  const nasabahId = localStorage.getItem("selectedNasabah");

  // Ambil nilai baru dari form
  const newJenis = document.getElementById("editJenis").value;
  //const newJumlah = Number(document.getElementById("editNominal").value);
  const newJumlah = Number(document.getElementById("editNominal").value.replace(/\./g, "")); //untuk edit
  const newKet = document.getElementById("editKeterangan").value;

  // Hitung selisih perubahan saldo
  let saldoDiff = 0;

  if (oldJenis === "masuk") saldoDiff -= oldJumlah;
  else saldoDiff += oldJumlah;

  if (newJenis === "masuk") saldoDiff += newJumlah;
  else saldoDiff -= newJumlah;
  closeModalBtn(editModal);
  // Update dokumen transaksi
  await updateDoc(
    doc(db, "users", uid, "nasabah", nasabahId, "transaksi", editTrxId), 
    {
      jenis: newJenis,
      jumlah: newJumlah,
      keterangan: newKet
    }
  );

  // Update saldo di parent nasabah
  await updateDoc(
    doc(db, "users", uid, "nasabah", nasabahId),
    { saldo: increment(saldoDiff) }
  );

  alert("Transaksi berhasil diupdate");
      loadNasabah(nasabahId);	  //tambahan

});

//=============================================|
//========== perbaikan Load History ===========|
//=============================================|
function loadTransaksi(uid) {
  const trxRef = collection(db, "users", uid, "nasabah", nasabahId, "transaksi");
  const tbody = document.getElementById("trxTable");

  onSnapshot(trxRef, (snapshot) => {
    tbody.innerHTML = ""; // reset table content

    snapshot.forEach(doc => {
      const trx = doc.data();
      const trxId = doc.id;

      const tgl = trx.createdAt.toDate();
      const tanggal = tgl.toLocaleDateString("id-ID");
      const jam = tgl.toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' });


const jenisClass = trx.jenis === "masuk" ? "masuk" : "keluar";//tambahan untuk mewarnai jenis

const tr = document.createElement("tr");
tr.innerHTML = `
  <td><input type="checkbox" class="trxCheck" data-id="${trxId}" data-jenis="${trx.jenis}" data-jumlah="${trx.jumlah}" data-keterangan="${trx.keterangan}"></td>
  <td>${jam}<br>${tanggal}</td>
  <td class="${jenisClass}">${trx.jenis}</td>
  <td>${trx.jumlah.toLocaleString()}</td>
  <td>${trx.keterangan}</td>
  <td><button class="editBtn" 
	data-id="${trxId}" 
	data-jenis="${trx.jenis}" 
	data-jumlah="${trx.jumlah}" 
	data-keterangan="${trx.keterangan}">Edit</button></td>
`;
      tbody.appendChild(tr); // gunakan tbody yg benar
    });
  });
}

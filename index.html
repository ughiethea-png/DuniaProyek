<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TABUNGAN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f3f4f6; }

    .container { max-width: 400px; margin: auto; padding: 20px; }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 60px;
    }

    .title {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #111827;
    }

    label { font-size: 14px; color: #374151; }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      text-align: center;
      border-radius: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .btn:hover { background: #1e40af; }

    .switch {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .switch a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Login Page -->
    <div class="card" id="loginPage">
      <div class="title">Login Tabungan</div>

      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Masukkan email" />

      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Masukkan password" />

      <button class="btn" id="loginBtn">Masuk</button>

      <div class="switch">
        Belum punya akun? <a href="#" onclick="showRegister()">Daftar</a>
		<h3 id="status">status</h3>
      </div>
    </div>

    <!-- Register Page -->
    <div class="card" id="registerPage" style="display:none;">
      <div class="title">Register</div>

      <label>Nama Lengkap</label>
      <input id="regName" type="text" placeholder="Masukkan nama" />

      <label>Email</label>
      <input id="regEmail" type="email" placeholder="Masukkan email" />

      <label>Password</label>
      <input id="regPass" type="password" placeholder="Masukkan password" />

      <button class="btn" id="regBtn">Daftar</button>
	  <h3 id="status"></h3>

      <div class="switch">
        Sudah punya akun? <a href="#" onclick="showLogin()">Login</a>
      </div>
    </div>

  </div>

  <script>
    function showRegister() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('registerPage').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('registerPage').style.display = 'none';
      document.getElementById('loginPage').style.display = 'block';
    }
  </script>
  <script type="module">
    // Firebase Config
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, 
	createUserWithEmailAndPassword, 
	signInWithEmailAndPassword } 
	from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
import { 
	getFirestore, 
	setDoc, 
	doc  } 
	from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"; 
	
const firebaseConfig = {
  apiKey: "AIzaSyD2tdSM2wvibgVztT34daOBE0FYKTTIBF4",
  authDomain: "tabungan-702cd.firebaseapp.com",
  databaseURL: "https://tabungan-702cd-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tabungan-702cd",
  storageBucket: "tabungan-702cd.firebasestorage.app",
  messagingSenderId: "1089401460941",
  appId: "1:1089401460941:web:5dcef23cd37963bef0b184"
};

export const app 	= initializeApp(firebaseConfig);
export const auth 	= getAuth(app);
export const db 	= getFirestore(app);

//----------------------------------------------------------------------------*/
//====  Login (cara 2) ========================================================
//=============================================================================
 //baca tombol <button class="btn" id="loginBtn">Masuk</button>
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value;
    const pass  = document.getElementById("loginPass").value;

    try {
      await signInWithEmailAndPassword(auth, email, pass); //baca ke server
      window.location.href = "dashboard.html"; //setelah login arahkan ke dashboard.html

    } catch (error) {
      document.getElementById("status").innerText = error.message; //pesan eror
    }
  });

//----------------------------------------------------------------------------*/
//======= Register (cara 2) ================================================== 
//=============================================================================
    //baca tombol <button class="btn" id="regBtn">Daftar</button>
  document.getElementById("regBtn").addEventListener("click", async () => {
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const pass  = document.getElementById("regPass").value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      const user = userCredential.user;

      await setDoc(doc(db, "users", user.uid), { //simpan data register
        name: name,
        email: email,
        role: "admin",
        createdAt: new Date()
      });

      document.getElementById("status").innerText = "Registrasi berhasil, silakan login...";
      setTimeout(() => {
        showLogin();
		//window.location.href = "login.html";
      }, 1000);

    } catch (error) {
      document.getElementById("status").innerText = error.message;
    }
  });
  </script>

</body>
</html>

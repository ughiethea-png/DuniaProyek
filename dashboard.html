<!-- Popup full screen -->
<div id="fullModal" class="modal">

<script>
// === Popup Tambah Nasabah ===
const modal = document.getElementById("fullModal");
const openModal = document.getElementById("openModalBtn");
const closeModal = document.getElementById("closeModalBtn");

function resetModal(modal) {
	document.getElementById("nama").value = "";
	document.getElementById("alamat").value = "";
	}
		
openModal.onclick = () => (modal.classList.add("show"),resetModal(modal));
closeModal.onclick = () => modal.classList.remove("show");

// Klik area luar → close
modal.onclick = e => {
  if (e.target === modal) modal.classList.remove("show");
};

// Init IndexedDB
let db;
const request = indexedDB.open("AvatarDB", 1);

request.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("avatarStore");
};

request.onsuccess = e => {
  db = e.target.result;
  loadAvatar();
};

// Load avatar from DB
function loadAvatar() {
  const tx = db.transaction("avatarStore", "readonly");
  const store = tx.objectStore("avatarStore");
  const avatarReq = store.get("avatarImg");

  avatarReq.onsuccess = () => {
    if (avatarReq.result) {
      document.getElementById("avatarImg").src = avatarReq.result;
    }
  };
}

// DOM elements
const uploadInput = document.getElementById("uploadAvatar");
const avatarImg = document.getElementById("avatarImg");
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const ctx = cropCanvas.getContext("2d");

let img = new Image();

// Open file picker
avatarImg.onclick = () => uploadInput.click();

// When user selects file
uploadInput.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => openCrop(img);
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

// Show crop modal
function openCrop(image) {
  cropCanvas.width = 300;
  cropCanvas.height = 300;

  ctx.clearRect(0, 0, 300, 300);
  ctx.drawImage(image, 0, 0, 300, 300);

  cropModal.style.display = "flex";
}

// Cancel crop
document.getElementById("cancelCrop").onclick = () => {
  cropModal.style.display = "none";
};

// Apply crop & save to IndexedDB
document.getElementById("applyCrop").onclick = () => {
  const finalData = cropCanvas.toDataURL("image/png");

  avatarImg.src = finalData;

  const tx = db.transaction("avatarStore", "readwrite");
  const store = tx.objectStore("avatarStore");
  store.put(finalData, "avatarImg");

  cropModal.style.display = "none";
};
/*
🎉 Semua fitur termasuk:
✔ Squircle avatar iOS style
✔ Upload avatar
✔ Full-screen crop modal
✔ Smooth animation
✔ Simpan avatar ke IndexedDB
✔ Reload tetap tersimpan*/

</script>

import { collection,  onSnapshot, query,  orderBy, doc, getDoc, getDocs, addDoc, serverTimestamp  } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

  document.getElementById("time").innerText = now.toLocaleTimeString("id-ID");

}, 1000);

document.getElementById("logoutBtn").addEventListener("click", async () => {

});

  const data = userDoc.data();
  document.getElementById("welcome").innerText = `Selamat datang : ${data.name}`;
//localStorage.setItem("idUser", user.uid);//
  loadNasabah(user.uid);
  // ==== Jalankan Listener Saat User Login ====
   // startRealtimeDashboard();
  //startRealtimeHistory();
});

// ==== simpan Data Nasabah ====
/*<p id="msg"></p>
<input type="text" id="nama" placeholder="Nama Nasabah" required />
<input type="number" id="saldo" placeholder="Saldo Awal" required />
<button id="saveNasabah">Simpan</button>*/


// ketika tombol "Simpan" diklik
document.getElementById("saveNasabah").onclick = async (e) => {
  e.preventDefault(); // mencegah reload page otomatis

  // ambil nilai input
  const nama = document.getElementById("nama").value;
  const alamat = document.getElementById("alamat").value; //tambah alamat
  const saldo = Number(document.getElementById("saldo").value = "0");
	modal.classList.remove("show"); //tutup modal
  try {
    // simpan data ke Firestore
    await addDoc(
      collection(db, "users", auth.currentUser.uid, "nasabah"),
      {
        nama,
        alamat,
		saldo,
        createdAt: new Date()
      }
    );
    // tampilkan pesan sukses
    //msg.style.color = "green";
    //msg.textContent = "Data nasabah berhasil disimpan!";
	alert("Data nasabah berhasil disimpan!");
	//modal.classList.remove("show");
	loadNasabah(auth.currentUser.uid)

  } catch (error) {
    //msg.style.color = "red";
    //msg.textContent = "Error: " + error.message;
	alert("Error: " + error.message);
  }
};
	
// ==== Load Data Nasabah ====
async function loadNasabah(uid) { 
  //const snap = await getDocs(collection(db, "users", uid, "nasabah")); //cara pertama
  const snap = await getDocs(collection(db, "users", auth.currentUser.uid, "nasabah"));
  let totalNasabah = snap.size;
  let totalSaldo = 0;

  const table = document.getElementById("historyTable");
  table.innerHTML = "";

  snap.forEach(docData => {
	  const nasabah = docData.data();
	  const d = nasabah.createdAt.toDate();
	  const tanggal = d.toLocaleDateString("id-ID");
	  const jam = d.toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' });

	  totalSaldo += nasabah.saldo ?? 0;

	  const tr = document.createElement("tr");
	  tr.innerHTML = `
		<td class="name" onclick="goToTransaksi('${docData.id}')">${nasabah.nama}</td>
		<td>${nasabah.saldo.toLocaleString()}</td>
		<td>${tanggal}</td>
		<td>${jam}</td>
	  `;

		table.appendChild(tr);
	});
  document.getElementById("totalNasabah").innerText = totalNasabah;
  document.getElementById("totalSaldo").innerText = totalSaldo.toLocaleString();
}
